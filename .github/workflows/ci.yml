name: CI/CD TopCaps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install all dependencies
      run: npm install
      # Esto instalará tanto dependencias normales como devDependencies
    
    - name: Run tests
      run: npm test
      # Esto ejecutará el script "test" de package.json
    
    - name: Run tests with coverage
      run: npm run test:coverage
